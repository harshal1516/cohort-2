<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keyboard Piano</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎹 My Keyboard Piano</h1>

        <div class="piano">

    <div class="key white" data-key="a">A</div>
    <div class="key black black1" data-key="w">W</div>

    <div class="key white" data-key="s">S</div>
    <div class="key black black2" data-key="e">E</div>

    <div class="key white" data-key="d">D</div>

    <div class="key white" data-key="f">F</div>
    <div class="key black black3" data-key="t">T</div>

    <div class="key white" data-key="g">G</div>
    <div class="key black black4" data-key="y">Y</div>

    <div class="key white" data-key="h">H</div>
    <div class="key black black5" data-key="u">U</div>

    <div class="key white" data-key="j">J</div>

</div>
    </div>
    <audio data-note="a" src="sounds/C.mp3"></audio>
<audio data-note="w" src="sounds/Csharp.mp3"></audio>
<audio data-note="s" src="sounds/D.mp3"></audio>
<audio data-note="e" src="sounds/Dsharp.mp3"></audio>
<audio data-note="d" src="sounds/E.mp3"></audio>
<audio data-note="f" src="sounds/F.mp3"></audio>
<audio data-note="t" src="sounds/Fsharp.mp3"></audio>
<audio data-note="g" src="sounds/G.mp3"></audio>
<audio data-note="y" src="sounds/Gsharp.mp3"></audio>
<audio data-note="h" src="sounds/A.mp3"></audio>
<audio data-note="u" src="sounds/Asharp.mp3"></audio>
<audio data-note="j" src="sounds/B.mp3"></audio>

    <script src="script.js"></script>

</body>

</html>
